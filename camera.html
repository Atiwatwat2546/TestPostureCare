<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>PostureCare Camera</title>


  <!-- MediaPipe -->

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #06130d,
          #0b2417,
          #07150e
        );

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 25px;

    }


    .container {

      width:
        min(1100px, 100%);

      background:
        rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.1);

      border-radius: 24px;

      padding: 25px;

      backdrop-filter:
        blur(20px);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.4);

    }


    .header {

      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-bottom: 20px;

    }


    .title {

      font-size: 28px;

      font-weight: 800;

    }


    .subtitle {

      color: #9fb5a7;

      margin-top: 5px;

      font-size: 14px;

    }


    .status {

      padding: 8px 14px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.08);

      color: #aab8b0;

      font-size: 14px;

    }


    .camera-wrapper {

      position: relative;

      width: 100%;

      background: #000;

      border-radius: 20px;

      overflow: hidden;

      aspect-ratio: 16 / 9;

    }


    video {

      width: 100%;

      height: 100%;

      object-fit: cover;

      transform:
        scaleX(-1);

      display: block;

    }


    canvas {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      pointer-events: none;

    }


    .overlay {

      position: absolute;

      top: 20px;

      left: 20px;

      display: flex;

      gap: 10px;

      pointer-events: none;

    }


    .badge {

      padding: 8px 14px;

      border-radius: 999px;

      background:
        rgba(0,0,0,.6);

      backdrop-filter:
        blur(10px);

      font-size: 14px;

    }


    .bottom-panel {

      margin-top: 20px;

      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 15px;

    }


    .card {

      background:
        rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 16px;

      padding: 18px;

    }


    .card-title {

      font-size: 13px;

      color: #8fa497;

      margin-bottom: 8px;

    }


    .value {

      font-size: 26px;

      font-weight: 800;

    }


    .message {

      margin-top: 20px;

      padding: 15px;

      border-radius: 14px;

      background:
        rgba(255,255,255,.05);

      color: #dce7e1;

      text-align: center;

    }


    .controls {

      display: flex;

      justify-content: center;

      gap: 12px;

      margin-top: 20px;

    }


    button {

      border: none;

      padding: 13px 25px;

      border-radius: 12px;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

    }


    .start {

      background: #31d27c;

      color: #03150b;

    }


    .stop {

      background: #ef4444;

      color: white;

    }


    button:disabled {

      opacity: .4;

      cursor: not-allowed;

    }


    .error {

      margin-top: 15px;

      padding: 14px;

      background:
        rgba(239,68,68,.15);

      border:
        1px solid
        rgba(239,68,68,.3);

      color: #ffb4b4;

      border-radius: 12px;

      display: none;

    }


    @media(max-width:700px) {

      .bottom-panel {

        grid-template-columns:
          1fr;

      }


      .header {

        flex-direction:
          column;

        align-items:
          flex-start;

        gap: 10px;

      }


      .title {

        font-size: 23px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">


    <div>

      <div class="title">
        PostureCare
      </div>

      <div class="subtitle">
        AI Posture Detection
      </div>

    </div>


    <div
      id="status"
      class="status">

      ยังไม่ได้เปิดกล้อง

    </div>


  </div>


  <div class="camera-wrapper">


    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>


    <canvas
      id="canvas">
    </canvas>


    <div class="overlay">

      <div
        id="cameraBadge"
        class="badge">

        Camera OFF

      </div>

    </div>


  </div>


  <div class="bottom-panel">


    <div class="card">

      <div class="card-title">
        Posture
      </div>

      <div
        id="posture"
        class="value">

        -

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Score
      </div>

      <div
        id="score"
        class="value">

        -

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Detection
      </div>

      <div
        id="detection"
        class="value">

        -

      </div>

    </div>


  </div>


  <div
    id="message"
    class="message">

    กด "เริ่มกล้อง"
    เพื่อเริ่มตรวจสอบท่าทาง

  </div>


  <div
    id="error"
    class="error">
  </div>


  <div class="controls">


    <button
      id="startBtn"
      class="start"
      onclick="startCamera()">

      📷 เริ่มกล้อง

    </button>


    <button
      id="stopBtn"
      class="stop"
      onclick="stopCamera()"
      disabled>

      ⏹ หยุดกล้อง

    </button>


  </div>


</div>


<script>


  /*
   * ==========================================
   * STATE
   * ==========================================
   */

  const video =
    document.getElementById(
      'video'
    );


  const canvas =
    document.getElementById(
      'canvas'
    );


  const ctx =
    canvas.getContext(
      '2d'
    );


  const statusEl =
    document.getElementById(
      'status'
    );


  const postureEl =
    document.getElementById(
      'posture'
    );


  const scoreEl =
    document.getElementById(
      'score'
    );


  const detectionEl =
    document.getElementById(
      'detection'
    );


  const messageEl =
    document.getElementById(
      'message'
    );


  const errorEl =
    document.getElementById(
      'error'
    );


  const startBtn =
    document.getElementById(
      'startBtn'
    );


  const stopBtn =
    document.getElementById(
      'stopBtn'
    );


  const cameraBadge =
    document.getElementById(
      'cameraBadge'
    );


  let stream =
    null;


  let pose =
    null;


  let cameraRunning =
    false;


  /*
   * Log ทุก 20 วินาที
   */

  let lastLogTime =
    0;


  const LOG_INTERVAL =
    20000;


  /*
   * ==========================================
   * ส่งข้อมูลกลับ Index.html
   * ==========================================
   */

  function sendToParent(
    type,
    data = {}
  ) {


    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(

        {

          source:
            'PostureCareCamera',

          type:
            type,

          ...data

        },

        '*'

      );

    }

  }


  /*
   * ==========================================
   * START CAMERA
   * ==========================================
   */

  async function startCamera() {

    hideError();


    try {


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          'Browser นี้ไม่รองรับ getUserMedia()'
        );

      }


      statusEl.textContent =
        'กำลังขอสิทธิ์กล้อง...';


      messageEl.textContent =
        'กรุณากด Allow เพื่ออนุญาตการใช้กล้อง';


      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video: {

              facingMode:
                'user',

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            },

            audio: false

          });


      video.srcObject =
        stream;


      await video.play();


      cameraRunning =
        true;


      startBtn.disabled =
        true;


      stopBtn.disabled =
        false;


      statusEl.textContent =
        'กล้องกำลังทำงาน';


      cameraBadge.textContent =
        '● Camera ON';


      messageEl.textContent =
        'กำลังตรวจสอบท่าทาง...';


      /*
       * reset log timer
       */

      lastLogTime =
        Date.now();


      sendToParent(
        'CAMERA_STARTED'
      );


      await setupPose();


    } catch(error) {

      console.error(
        'Camera error:',
        error
      );


      showCameraError(
        error
      );

    }

  }


  /*
   * ==========================================
   * MEDIAPIPE
   * ==========================================
   */

  async function setupPose() {


    pose =
      new Pose({

        locateFile:
          function(file) {

            return (
              'https://cdn.jsdelivr.net/npm/@mediapipe/pose/' +
              file
            );

          }

      });


    pose.setOptions({

      modelComplexity: 1,

      smoothLandmarks: true,

      enableSegmentation: false,

      smoothSegmentation: false,

      minDetectionConfidence:
        0.55,

      minTrackingConfidence:
        0.55

    });


    pose.onResults(
      onPoseResults
    );


    processFrame();

  }


  /*
   * ==========================================
   * PROCESS FRAME
   * ==========================================
   */

  async function processFrame() {


    if (!cameraRunning) {
      return;
    }


    if (
      video.readyState >= 2
    ) {

      try {

        await pose.send({
          image: video
        });

      } catch(error) {

        console.error(
          'Pose error:',
          error
        );

      }

    }


    requestAnimationFrame(
      processFrame
    );

  }


  /*
   * ==========================================
   * POSE RESULT
   * ==========================================
   */

  function onPoseResults(
    results
  ) {


    if (!cameraRunning) {
      return;
    }


    canvas.width =
      video.videoWidth ||
      1280;


    canvas.height =
      video.videoHeight ||
      720;


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
     * กล้อง Mirror
     */

    ctx.save();

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(
      -1,
      1
    );


    ctx.drawImage(
      results.image,
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
     * ไม่พบคน
     */

    if (
      !results.poseLandmarks
    ) {


      ctx.restore();


      postureEl.textContent =
        'ไม่พบคน';


      scoreEl.textContent =
        '-';


      detectionEl.textContent =
        'ไม่พบ';


      statusEl.textContent =
        'ไม่พบร่างกาย';


      messageEl.textContent =
        'กรุณานั่งให้เห็นศีรษะ ไหล่ และลำตัว';


      sendToParent(
        'NO_POSE'
      );


      return;

    }


    /*
     * วาด Skeleton
     */

    try {

      drawConnectors(
        ctx,
        results.poseLandmarks,
        POSE_CONNECTIONS,
        {
          color:
            '#31d27c',

          lineWidth:
            3
        }
      );


      drawLandmarks(
        ctx,
        results.poseLandmarks,
        {
          color:
            '#ffffff',

          lineWidth:
            1,

          radius:
            4
        }
      );

    } catch(error) {

      console.warn(
        'Drawing error:',
        error
      );

    }


    ctx.restore();


    /*
     * วิเคราะห์ท่าทาง
     */

    const posture =
      evaluatePosture(
        results.poseLandmarks
      );


    updateUI(
      posture
    );


    /*
     * ส่งผล Real-time
     */

    sendToParent(
      'POSTURE_STATE',
      {
        posture:
          posture
      }
    );


    /*
     * บันทึก Log
     */

    accumulatePosture(
      posture
    );

  }


  /*
   * ==========================================
   * POSTURE CALCULATION
   * ==========================================
   */

  function pt(
    lms,
    i
  ) {

    return lms[i] || null;

  }


  function dist(
    a,
    b
  ) {

    return Math.hypot(
      a.x - b.x,
      a.y - b.y
    );

  }


  function avgPoint(
    a,
    b
  ) {

    return {

      x:
        (a.x + b.x) / 2,

      y:
        (a.y + b.y) / 2

    };

  }


  function angleFromVertical(
    a,
    b
  ) {

    const dx =
      b.x - a.x;

    const dy =
      b.y - a.y;


    return Math.abs(

      Math.atan2(
        dx,
        -dy
      ) *
      180 /
      Math.PI

    );

  }


  function evaluatePosture(
    lms
  ) {


    const nose =
      pt(lms, 0);


    const lShoulder =
      pt(lms, 11);


    const rShoulder =
      pt(lms, 12);


    const lHip =
      pt(lms, 23);


    const rHip =
      pt(lms, 24);


    if (
      !nose ||
      !lShoulder ||
      !rShoulder ||
      !lHip ||
      !rHip
    ) {

      return {

        valid:
          false,

        score:
          0,

        reason:
          'ขยับให้เห็นศีรษะ ไหล่ และสะโพก'

      };

    }


    const shoulder =
      avgPoint(
        lShoulder,
        rShoulder
      );


    const hip =
      avgPoint(
        lHip,
        rHip
      );


    const torsoH =
      Math.max(
        0.05,
        dist(
          shoulder,
          hip
        )
      );


    /*
     * ศีรษะยื่น
     */

    const headForward =
      Math.abs(
        nose.x -
        shoulder.x
      ) /
      torsoH;


    /*
     * ไหล่เอียง
     */

    const shoulderTilt =
      angleFromVertical(

        {
          x:
            lShoulder.x,

          y:
            lShoulder.y
        },

        {
          x:
            rShoulder.x,

          y:
            rShoulder.y
        }

      );


    /*
     * ลำตัวเอียง
     */

    const torsoLean =
      angleFromVertical(
        hip,
        shoulder
      );


    let score =
      100;


    const reasons =
      [];


    /*
     * HEAD
     */

    if (
      headForward > 0.24
    ) {

      score -= 35;

      reasons.push(
        'ศีรษะโน้มไปด้านหน้ามาก'
      );

    }

    else if (
      headForward > 0.18
    ) {

      score -= 18;

      reasons.push(
        'ลองจัดศีรษะให้อยู่เหนือแนวลำตัว'
      );

    }


    /*
     * SHOULDER
     */

    if (
      shoulderTilt > 15
    ) {

      score -= 25;

      reasons.push(
        'ไหล่เอียง'
      );

    }

    else if (
      shoulderTilt > 9
    ) {

      score -= 12;

      reasons.push(
        'ปรับระดับไหล่ให้สมดุล'
      );

    }


    /*
     * TORSO
     */

    if (
      torsoLean > 18
    ) {

      score -= 30;

      reasons.push(
        'ลำตัวเอนไปด้านข้าง/หน้า'
      );

    }

    else if (
      torsoLean > 12
    ) {

      score -= 15;

      reasons.push(
        'ปรับลำตัวให้ตั้งตรงขึ้น'
      );

    }


    score =
      Math.max(
        0,
        Math.min(
          100,
          score
        )
      );


    return {

      valid:
        true,

      score:
        Math.round(score),

      good:
        score >= 78,

      reason:
        reasons.length
          ? reasons.join(' • ')
          : 'ท่านั่งอยู่ในเกณฑ์ดี',

      headForward:
        headForward,

      shoulderTilt:
        shoulderTilt,

      torsoLean:
        torsoLean

    };

  }


  /*
   * ==========================================
   * UPDATE CAMERA UI
   * ==========================================
   */

  function updateUI(
    m
  ) {


    if (!m.valid) {

      postureEl.textContent =
        'ไม่พบท่าครบ';

      scoreEl.textContent =
        '—';

      detectionEl.textContent =
        'ไม่ครบ';

      messageEl.textContent =
        m.reason;

      return;

    }


    postureEl.textContent =
      m.good
        ? 'ดี'
        : 'ควรปรับ';


    scoreEl.textContent =
      m.score;


    detectionEl.textContent =
      'พบร่างกาย';


    messageEl.textContent =
      m.good
        ? '✓ ท่าทางดีมาก รักษาท่านี้ไว้'
        : '⚠ ' + m.reason;

  }


  /*
   * ==========================================
   * ACCUMULATE / SAVE
   * ==========================================
   */

  let stablePosture =
    null;


  let stableStartedAt =
    0;


  function accumulatePosture(
    m
  ) {


    if (!m.valid) {
      return;
    }


    const now =
      Date.now();


    const type =
      m.good
        ? 'good'
        : 'needs_adjustment';


    /*
     * ถ้าเปลี่ยนสถานะ
     * เริ่มนับใหม่
     */

    if (
      stablePosture !== type
    ) {

      stablePosture =
        type;

      stableStartedAt =
        now;

      return;

    }


    /*
     * ทุก 20 วินาที
     */

    if (
      now - lastLogTime >=
      LOG_INTERVAL
    ) {


      const durationSec =
        Math.min(
          60,
          Math.max(
            5,
            Math.round(
              (
                now -
                stableStartedAt
              ) / 1000
            )
          )
        );


      sendToParent(
        'POSTURE_LOG',
        {

          log: {

            posture:
              m.good
                ? 'good'
                : 'needs_adjustment',

            reason:
              m.reason,

            score:
              m.score,

            headForward:
              m.headForward,

            shoulderTilt:
              m.shoulderTilt,

            torsoLean:
              m.torsoLean,

            durationSec:
              durationSec

          }

        }
      );


      lastLogTime =
        now;


      stableStartedAt =
        now;

    }

  }


  /*
   * ==========================================
   * STOP
   * ==========================================
   */

  function stopCamera() {


    cameraRunning =
      false;


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      stream =
        null;

    }


    video.srcObject =
      null;


    startBtn.disabled =
      false;


    stopBtn.disabled =
      true;


    statusEl.textContent =
      'หยุดกล้องแล้ว';


    cameraBadge.textContent =
      'Camera OFF';


    postureEl.textContent =
      '-';


    scoreEl.textContent =
      '-';


    detectionEl.textContent =
      '-';


    messageEl.textContent =
      'กด "เริ่มกล้อง" เพื่อเริ่มใหม่';


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    sendToParent(
      'CAMERA_STOPPED'
    );

  }


  /*
   * ==========================================
   * CAMERA ERROR
   * ==========================================
   */

  function showCameraError(
    error
  ) {


    let message =
      'ไม่สามารถเปิดกล้องได้';


    if (
      error.name ===
      'NotAllowedError'
    ) {

      message =
        'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณากด Allow';

    }

    else if (
      error.name ===
      'NotFoundError'
    ) {

      message =
        'ไม่พบกล้องในอุปกรณ์';

    }

    else if (
      error.name ===
      'NotReadableError'
    ) {

      message =
        'กล้องกำลังถูกใช้งานโดยโปรแกรมอื่น';

    }

    else if (
      error.name ===
      'SecurityError'
    ) {

      message =
        'Browser ไม่อนุญาตให้เว็บไซต์นี้ใช้กล้อง';

    }

    else if (
      error.message
    ) {

      message =
        error.message;

    }


    errorEl.textContent =
      message;


    errorEl.style.display =
      'block';


    statusEl.textContent =
      'Camera Error';


    startBtn.disabled =
      false;


    stopBtn.disabled =
      true;


    sendToParent(
      'CAMERA_ERROR',
      {
        message:
          message
      }
    );

  }


  function hideError() {

    errorEl.style.display =
      'none';

  }


  /*
   * ==========================================
   * รับคำสั่งจาก Index.html
   * ==========================================
   */

  window.addEventListener(
    'message',
    function(event) {


      /*
       * รับคำสั่ง STOP เท่านั้น
       */

      if (
        !event.data ||
        event.data.source !==
        'PostureCareApp'
      ) {

        return;

      }


      if (
        event.data.type ===
        'STOP_CAMERA'
      ) {

        stopCamera();

      }

    }
  );


  /*
   * ==========================================
   * READY
   * ==========================================
   */

  sendToParent(
    'CAMERA_READY'
  );


  /*
   * ==========================================
   * ปิดหน้าต่าง
   * ==========================================
   */

  window.addEventListener(
    'beforeunload',
    function() {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }

    }
  );


</script>

</body>
</html>
